version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: securesupply_postgres
    environment:
      POSTGRES_DB: securesupply
      POSTGRES_USER: securesupply_user
      POSTGRES_PASSWORD: securesupply_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesupply_user -d securesupply"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securesupply_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securesupply_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://securesupply_user:securesupply_password@postgres:5432/securesupply
      SECRET_KEY: securesupply-ai-production-super-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securesupply_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
